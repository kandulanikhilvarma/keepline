name: Keepline
options:
  bundleIdPrefix: studio.kandula
  deploymentTarget:
    iOS: '17.0'
packages:
  KeeplineCore:
    path: ..
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    APP_GROUP_IDENTIFIER: group.studio.kandula.keepline
targets:
  Keepline:
    type: application
    platform: iOS
    sources: [Keepline, Shared]
    dependencies:
      - package: KeeplineCore
      - target: KeeplineWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.kandula.keepline
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Keepline/Info.plist
      properties:
        CFBundleDisplayName: Keepline
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [keepline]
        KeeplineAppGroup: $(APP_GROUP_IDENTIFIER)
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Keepline/Keepline.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_IDENTIFIER)]
  KeeplineWidget:
    type: app-extension
    platform: iOS
    sources: [KeeplineWidget, Shared]
    dependencies:
      - package: KeeplineCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.kandula.keepline.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: KeeplineWidget/Info.plist
      properties:
        CFBundleDisplayName: Keepline
        KeeplineAppGroup: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: KeeplineWidget/KeeplineWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_IDENTIFIER)]
  KeeplineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [KeeplineUITests]
    dependencies:
      - target: Keepline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.kandula.keepline.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Keepline:
    build:
      targets:
        Keepline: all
        KeeplineWidget: all
    test:
      targets: [KeeplineUITests]
